name: build-debug
on: [ workflow_dispatch ]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: android-actions/setup-android@v3

      - name: SDK / NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" \
                              "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - run: python3 native/build_all.py
      - run: sh native/guest64/build.sh 36

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStandardDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: aemu-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk
