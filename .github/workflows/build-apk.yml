name: Build APK (cloud)

# Cloud build for AEmulator. Produces a downloadable APK artifact on every
# relevant push and on demand via the Actions tab ("Run workflow").
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (debug is signed with the auto-generated debug key and is directly installable)"
        type: choice
        required: true
        default: debug
        options:
          - debug
          - release
      flavor:
        description: "Product flavor"
        type: choice
        required: true
        default: standard
        options:
          - standard
          - clone
          - v0003
          - all
      sign_release:
        description: "Sign a release build using the SIGNING_* repository secrets (release builds only)"
        type: boolean
        required: false
        default: false
      publish_release:
        description: "Publish the built APK as a GitHub Release (manual runs only; off by default)"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Release tag; leave empty for v<version>-<run number>"
        type: string
        required: false
        default: ""
      release_prerelease:
        description: "Mark a newly created release as a pre-release"
        type: boolean
        required: false
        default: true
  # Push builds are handled by build-full.yml (full native rebuild). This
  # workflow stays available for on-demand fast APK builds and PR checks.
  pull_request:
    paths:
      - "app/**"
      - "native/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.collect.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # ubuntu-latest ships the Android SDK. Configure it directly instead of
        # relying on a third-party setup action (which failed on the first run).
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$c" ]; then SDKMGR="$c"; break; fi
          done
          if [ -z "${SDKMGR:-}" ]; then
            echo "::error::sdkmanager not found under $SDK"
            ls -R "$SDK" | head -60
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"
          echo "Using $SDKMGR"
          "$SDKMGR" --version

      - name: Install SDK platform 36 and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          java -version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Apply cross-platform build fixes
        # gradle.properties shipped upstream hardcodes a Windows-only JBR path,
        # and gradlew has no executable bit in git. Both break Linux CI.
        run: |
          chmod +x gradlew
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          grep -v '^org.gradle.java.home=' gradle.properties | head -5 || true

      - name: Restore release signing key (optional)
        if: ${{ inputs.build_type == 'release' && inputs.sign_release }}
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing requested but SIGNING_* secrets are incomplete."
            echo "::error::Add SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Release signing configured."

      - name: Assemble APK
        shell: bash
        run: |
          set -euo pipefail
          BT="${{ inputs.build_type || 'debug' }}"
          FL="${{ inputs.flavor || 'standard' }}"
          case "$BT" in
            debug)   B=Debug ;;
            release) B=Release ;;
            *) echo "Unknown build type: $BT"; exit 1 ;;
          esac
          if [ "$FL" = "all" ]; then
            TASK="assemble${B}"
          else
            case "$FL" in
              standard) F=Standard ;;
              clone)    F=Clone ;;
              v0003)    F=V0003 ;;
              *) echo "Unknown flavor: $FL"; exit 1 ;;
            esac
            TASK="assemble${F}${B}"
          fi
          echo "Gradle task: $TASK"
          echo "### Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build type: \`$BT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flavor: \`$FL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Task: \`$TASK\`" >> "$GITHUB_STEP_SUMMARY"
          ./gradlew --no-daemon --stacktrace "$TASK"

      - name: Collect APKs and checksums
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} build-artifacts/ \;
          echo "APK files:"
          ls -lh build-artifacts/*.apk
          sha256sum build-artifacts/*.apk > build-artifacts/SHA256SUMS.txt
          VER=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[0-9A-Za-z.+-]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh build-artifacts/*.apk >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.build_type || 'debug' }}" = "release" ] && [ "${{ inputs.sign_release }}" != "true" ]; then
            echo "> Release APK is **unsigned** and cannot be installed as-is. Use the debug build, or configure the SIGNING_* secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AEmulator-${{ inputs.build_type || 'debug' }}-${{ inputs.flavor || 'standard' }}-${{ github.run_number }}
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Optional release publishing. Runs only when the workflow is started by hand
  # with the publish_release switch enabled; PR builds never create releases.
  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: AEmulator-${{ inputs.build_type || 'debug' }}-${{ inputs.flavor || 'standard' }}-${{ github.run_number }}
          path: release-assets

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_INPUT: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.release_prerelease }}
          VERSION: ${{ needs.build.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
          FLAVOR: ${{ inputs.flavor || 'standard' }}
        run: |
          set -euo pipefail
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ]; then TAG="v${VERSION}-${RUN_NUMBER}"; fi
          {
            echo "Automated fast APK build of AEmulator."
            echo ""
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Build type: \`$BUILD_TYPE\`, flavor: \`$FLAVOR\`"
            echo "- Workflow run: $SERVER_URL/$GH_REPO/actions/runs/$RUN_ID"
            echo "- APK checksums: \`SHA256SUMS.txt\`"
          } > notes.md
          shopt -s nullglob
          ASSETS=(release-assets/*.apk release-assets/SHA256SUMS.txt)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No APK found in the downloaded artifact"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            echo "Updated existing release $TAG"
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" "${ASSETS[@]}" --prerelease --title "AEmulator $TAG" --notes-file notes.md
            echo "Created pre-release $TAG"
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "AEmulator $TAG" --notes-file notes.md
            echo "Created release $TAG"
          fi
          echo "### Release" >> "$GITHUB_STEP_SUMMARY"
          echo "$SERVER_URL/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
