org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# JDK 17 is required. Do not hardcode org.gradle.java.home here: the upstream
# value pointed at a Windows-only Android Studio JBR path and broke Linux CI
# builds. Gradle uses JAVA_HOME (set by setup-java in GitHub Actions).
